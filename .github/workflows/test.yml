name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: PHP ${{ matrix.php }} / Composer ${{ matrix.composer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Composer 2.2 is the LTS line that still runs on PHP < 7.2.5.
          - { php: '5.6', composer: '2.2' }
          - { php: '7.0', composer: '2.2' }
          - { php: '7.4', composer: '2' }
          - { php: '8.1', composer: '2' }
          - { php: '8.3', composer: '2' }
          - { php: '8.5', composer: '2' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Lint
        run: for f in src/*.php; do php -l "$f"; done

      - name: Validate composer.json
        run: composer validate --strict

      - name: End-to-end tests
        run: tests/e2e.sh
